name: Validate Cloudflare Worker

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_FORMSPREE_FORM_ID: ${{ secrets.VITE_FORMSPREE_FORM_ID }}
      - run: npm ci --prefix cloudflare
      - run: npm run deploy:dry-run --prefix cloudflare
